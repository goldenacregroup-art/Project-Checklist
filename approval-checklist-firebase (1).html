<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Colony Approval Checklist</title>
<style>
:root{--bg:#f6f5f1;--pn:#fff;--tx:#1d2a26;--mu:#66726d;--ln:#dfddd5;--ac:#1f5c4a;--ac2:#e3efe9;--wn:#b4690e;--ok:#2e7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a18;--pn:#1c2421;--tx:#e8eeeb;--mu:#93a19b;--ln:#2e3935;--ac:#6fc3a3;--ac2:#22352e;--wn:#e0a050;--ok:#6fc98f}}
:root[data-theme=dark]{--bg:#141a18;--pn:#1c2421;--tx:#e8eeeb;--mu:#93a19b;--ln:#2e3935;--ac:#6fc3a3;--ac2:#22352e;--wn:#e0a050;--ok:#6fc98f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--pn);border-right:1px solid var(--ln);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font:700 17px Georgia,serif;margin:0 8px 2px}aside small{display:block;margin:0 8px 12px;color:var(--mu)}
.ph{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.ph:hover{background:var(--ac2)}.ph.on{background:var(--ac2);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.ph .r{display:flex;justify-content:space-between;gap:6px}.ph .c{color:var(--mu);font-size:12px;white-space:nowrap}
.bar{height:4px;background:var(--ln);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0}
main{padding:18px 22px;max-width:980px;width:100%}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.top input,.top select,.top button{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--tx)}
.top input{flex:1;min-width:160px}.top button{cursor:pointer}
.sum{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sum b{font:700 28px Georgia,serif}.sum .bar{flex:1;min-width:140px;height:8px}
h2{font:700 18px Georgia,serif;margin:18px 0 8px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;overflow:hidden}
.it.done .t{color:var(--mu);text-decoration:line-through}
.hd{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.hd input{width:20px;height:20px;accent-color:var(--ok);flex:none;cursor:pointer}
.n{color:var(--mu);font-size:12px;min-width:26px}.t{flex:1;font-weight:500}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.dt{display:none;padding:4px 14px 14px 58px;border-top:1px dashed var(--ln)}.it.open .dt{display:block}
.dt h4{margin:12px 0 4px;font-size:13px;color:var(--mu);font-weight:600}
.off{background:var(--ac2);border-radius:8px;padding:8px 10px}
ol{margin:0;padding-left:0;list-style:none;counter-increment:s}
ol li{display:flex;gap:10px;padding:6px 0;counter-increment:s}
ol li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:12px;display:grid;place-items:center;margin-top:1px}
.empty{padding:30px;text-align:center;color:var(--mu)}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:230px;border-right:0;border-bottom:1px solid var(--ln)}main{padding:14px 12px}.dt{padding-left:14px}.tag{display:none}}
.pj{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.pj button,.pj input{font:inherit;padding:7px 12px;border:1px solid var(--ln);border-radius:99px;background:var(--pn);color:var(--tx);cursor:pointer}.pj input{cursor:text;border-radius:8px}.pj .pc.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}.pj .pc span{opacity:.7;font-size:12px}.pj .dl{margin-left:auto;color:#b3261e;border-color:#b3261e}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>

<button id="ex">Expand all</button><button id="co">Collapse all</button><button id="cv">Export CSV</button><button id="rs">Reset</button></div>

let p=[null,"","",0,""];const D=RAW.split("\n").map((l,i)=>{const f=l.split("|");const r=[0,1,2,3,4].map(k=>{const v=f[k];if(v===undefined||v==="")return p[k];return k==3||k==0?+v:v});p=r;return{id:i+1,ph:r[0],t:r[1],au:r[2],g:r[3],st:r[4]}});
const $=s=>document.querySelector(s);let cur=-1,adding=false,dc=false,P;
try{P=JSON.parse(localStorage.getItem("acl2"))}catch(e){}
if(!P||!P.list||!P.list.length){let o={};try{o=JSON.parse(localStorage.getItem("acl")||"{}")}catch(e){}P={list:[{id:1,name:"Project 1",done:o}],cur:1,n:1}}
const PR=()=>P.list.find(x=>x.id==P.cur)||P.list[0];
let S=PR().done;
const setSy=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
let sT;
function push(){if(!fref){return}setDoc(fref,{data:JSON.stringify(P),by:CID,at:Date.now()}).then(()=>setSy("☁ Synced")).catch(e=>{console.error(e);setSy("⚠ Sync error (check Firestore rules / login)")})}
const save=()=>{try{localStorage.setItem("acl2",JSON.stringify(P))}catch(e){}setSy("☁ Saving…");clearTimeout(sT);sT=setTimeout(push,400)};
let firstSnap=true,unsub=null;
function listen(){
 if(unsub)unsub();
 firstSnap=true;
 unsub=onSnapshot(fref,snap=>{
  if(!snap.exists()){if(firstSnap){firstSnap=false;push()}return}
  firstSnap=false;
  const d=snap.data();
  if(d.by===CID||snap.metadata.hasPendingWrites){setSy("☁ Synced");return}
  try{const n=JSON.parse(d.data);
   if(n&&n.list&&n.list.length){const c=P.cur;P=n;if(P.list.some(x=>x.id==c))P.cur=c;S=PR().done;
    try{localStorage.setItem("acl2",JSON.stringify(P))}catch(e){}
    render();setSy("☁ Synced")}}catch(e){console.error(e)}
 },err=>{console.error(err);setSy("⚠ Offline / permission error")});
}
onAuthStateChanged(auth,u=>{
 if(u){fref=doc(db,"users",u.uid);listen()}
 else{signInAnonymously(auth).catch(e=>{console.error(e);setSy("⚠ Anonymous sign-in is disabled (enable it in Firebase Console)")})}
});
const stages=[...new Set(D.map(d=>d.st))];
$("#sf").innerHTML+=stages.map(s=>`<option>${s}</option>`).join("");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function side(){const tot=D.length,dn=D.filter(d=>S[d.id]).length;
let h=`<button class="ph ${cur<0?"on":""}" data-p="-1"><div class="r"><span>All Phases</span><span class="c">${dn}/${tot}</span></div></button>`;
PH.forEach((n,i)=>{const a=D.filter(d=>d.ph==i),c=a.filter(d=>S[d.id]).length;
h+=`<button class="ph ${cur==i?"on":""}" data-p="${i}"><div class="r"><span>${n}</span><span class="c">${c}/${a.length}</span></div><div class="bar"><i style="width:${c/a.length*100}%"></i></div></button>`});
$("#ph").innerHTML=h;const pc=Math.round(dn/tot*100);$("#pc").textContent=pc+"%";$("#pb").style.width=pc+"%";$("#pt").textContent=`${PR().name}: ${dn} / ${tot} complete`;if(!adding)proj()}
function render(){const q=$("#q").value.toLowerCase(),sf=$("#sf").value,st=$("#st").value;
const a=D.filter(d=>(cur<0||d.ph==cur)&&(!sf||d.st==sf)&&(!st||(st=="d")==!!S[d.id])&&(!q||(d.t+d.au+G[d.g][0]+G[d.g][1]).toLowerCase().includes(q)));
let h="",last=-1;a.forEach(d=>{if(d.ph!=last){h+=`<h2>${PH[d.ph]}</h2>`;last=d.ph}
const g=G[d.g];h+=`<div class="it ${S[d.id]?"done":""}" data-i="${d.id}"><div class="hd"><input type="checkbox" ${S[d.id]?"checked":""} aria-label="Done"><span class="n">${d.id}</span><span class="t">${esc(d.t)}</span><span class="tag">${d.st}</span></div>
<div class="dt"><h4>Department / Authority</h4><div>${esc(d.au)}</div><h4>Officer / Desk to Contact</h4><div class="off">${esc(g[0])}</div><h4>Apply-to-approval process</h4><ol>${g[1].split(" → ").map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div></div>`});
$("#list").innerHTML=h||'<div class="empty">No results found. Try changing the search or filters.</div>';side()}
$("#list").onclick=e=>{const it=e.target.closest(".it");if(!it)return;const id=it.dataset.i;
if(e.target.type=="checkbox"){S[id]=e.target.checked?1:0;save();it.classList.toggle("done",e.target.checked);side();if($("#st").value)render();return}
it.classList.toggle("open")};
$("#ph").onclick=e=>{const b=e.target.closest(".ph");if(b){cur=+b.dataset.p;render();scrollTo(0,0)}};
["#q","#sf","#st"].forEach(s=>$(s).oninput=render);
let rt;$("#rs").onclick=function(){if(!this.dataset.c){this.dataset.c=1;this.textContent="Click again to confirm";rt=setTimeout(()=>{delete this.dataset.c;this.textContent="Reset"},3000);return}
clearTimeout(rt);delete this.dataset.c;this.textContent="Reset";PR().done={};S=PR().done;save();render()};

const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=PR().name+"-checklist.csv";document.body.appendChild(a);a.click();a.remove()};
function proj(){let h=P.list.map(x=>{const n=Object.values(x.done).filter(Boolean).length;return `<button class="pc ${x.id==P.cur?"on":""}" data-pid="${x.id}">${esc(x.name)} <span>${Math.round(n/D.length*100)}%</span></button>`}).join("");

else if(a=="no"){adding=false;proj()}
